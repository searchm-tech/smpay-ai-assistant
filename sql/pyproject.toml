[project]
name = "smpay-db"
version = "0.1.0"
description = "Supabase(PostgreSQL + pgvector) 마이그레이션 적용 도구와 DB 테스트"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "db: 실제 Supabase DB가 필요한 테스트 (DATABASE_ADMIN_URL 등이 없으면 건너뜀)",
    "perf: 합성 벡터로 지연을 재는 무거운 테스트 (RUN_PERF=1 일 때만)",
    "e2e: 실행 중인 임베딩 서비스가 필요한 테스트 (EMBEDDER_URL, EMBEDDER_SECRET)",
]
