[project]
name = "smpay-ingest"
version = "0.1.0"
description = "Notion 문서 수집 (회사 데스크탑에서 구동하는 배치)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "db: 실제 Postgres(로컬 일회용 DB 또는 Supabase)가 필요한 테스트. 환경변수가 없으면 건너뜀",
    "e2e: 실제 임베딩 서버와 로컬 DB가 필요한 end-to-end 테스트",
]
